<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <div class="container">
        <?php $activeMenu = 'bugs'; require dirname(__DIR__) . '/partials/header.html'; ?>

            <div class="alert <?= htmlspecialchars($flash['type']) ?>">
                <?= htmlspecialchars($flash['message']) ?>
            </div>
        <?php endif; ?>

        <section class="table-section">
            <div class="section-header">
                <h2>Все дефекты (<?= (int)$totalItems ?>)</h2>
                <a href="bug_create.php" class="btn-primary">+ Создать баг</a>

            <!-- Форма поиска (LIKE) и фильтрации -->
            <form method="GET" action="bugs.php" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;">
                <input type="text" name="q" value="<?= htmlspecialchars($search) ?>" placeholder="Поиск по заголовку или описанию..." style="flex: 1; min-width: 220px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;">
                
                <select name="status" style="padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
                    <option value="">Все статусы</option>
                    <?php foreach ($statuses as $st): ?>
                        <option value="<?= htmlspecialchars($st) ?>" <?= $filterStatus === $st ? 'selected' : '' ?>><?= htmlspecialchars($st) ?></option>
                    <?php endforeach; ?>
                </select>

                <select name="priority" style="padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
                    <option value="">Все приоритеты</option>
                    <?php foreach ($priorities as $pr): ?>
                        <option value="<?= htmlspecialchars($pr) ?>" <?= $filterPriority === $pr ? 'selected' : '' ?>><?= htmlspecialchars($pr) ?></option>
                    <?php endforeach; ?>
                </select>

                <button type="submit" class="btn-primary" style="border: none; cursor: pointer;">Найти</button>
                
                <?php if ($search !== '' || $filterStatus !== '' || $filterPriority !== ''): ?>
                    <a href="bugs.php" class="nav-btn">Сбросить</a>
                <?php endif; ?>
            </form>

            <?php if (count($bugs) > 0): ?>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Проект</th>
                                <th>Заголовок</th>
                                <th>Статус</th>
                                <th>Приоритет</th>
                                <th>Автор</th>
                                <th>Исполнитель</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <?php foreach ($bugs as $bug): ?>
                                <tr>
                                    <td><?= (int)$bug['bug_id'] ?></td>
                                    <td>
                                        <a href="project_view.php?id=<?= (int)$bug['project_id'] ?>" class="table-link">
                                            [<?= htmlspecialchars($bug['project_code']) ?>]
                                        </a>
                                    </td>
                                    <td>
                                        <a href="bug_view.php?id=<?= (int)$bug['bug_id'] ?>" class="table-link">
                                            <?= htmlspecialchars($bug['title']) ?>
                                        </a>
                                    </td>
                                    <td><?= htmlspecialchars($bug['status']) ?></td>
                                    <td><strong><?= htmlspecialchars($bug['priority']) ?></strong></td>
                                    <td><?= htmlspecialchars($bug['reporter_name'] ?? '—') ?></td>
                                    <td><?= htmlspecialchars($bug['assignee_name'] ?? 'Не назначен') ?></td>
                                    <td class="actions-cell">
                                        <a href="bug_view.php?id=<?= (int)$bug['bug_id'] ?>" class="btn-sm">Открыть</a>
                                        
                                        <?php if (canManageBug($pdo, $bug)): ?>
                                            <a href="bug_edit.php?id=<?= (int)$bug['bug_id'] ?>" class="btn-sm">Изменить</a>
                                            <form method="POST" action="bug_delete.php" class="inline-form" onsubmit="return confirm('Удалить этот дефект и его историю?');">
                                                <input type="hidden" name="csrf_token" value="<?= htmlspecialchars(csrfToken()) ?>">
                                                <input type="hidden" name="bug_id" value="<?= (int)$bug['bug_id'] ?>">
                                                <button type="submit" class="btn-sm btn-danger">Удалить</button>
                                            </form>
                                        <?php endif; ?>
                                    </td>
                                </tr>
                            <?php endforeach; ?>
                        </tbody>
                    </table>
                </div>

                <!-- Блок пагинации -->
                <?php if ($totalPages > 1): ?>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px;">
                        <span class="muted-hint">Показано <?= count($bugs) ?> из <?= (int)$totalItems ?> (Страница <?= (int)$page ?> из <?= (int)$totalPages ?>)</span>
                        <div style="display: flex; gap: 6px;">
                            <?php for ($i = 1; $i <= $totalPages; $i++): ?>
                                <?php 
                                    $queryParams = http_build_query([
                                        'q'        => $search,
                                        'status'   => $filterStatus,
                                        'priority' => $filterPriority,
                                        'page'     => $i,
                                    ]);
                                ?>
                                <a href="bugs.php?<?= $queryParams ?>" class="nav-btn <?= $i === $page ? 'active' : '' ?>">
                                    <?= $i ?>
                                </a>
                            <?php endfor; ?>
                        </div>
                    </div>
                <?php endif; ?>

            <?php else: ?>
                <p class="empty-msg">Дефекты не найдены.</p>
            <?php endif; ?>
        </section>
    </div>
</body>
</html>
