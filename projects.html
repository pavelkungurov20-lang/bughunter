<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BugHunter — Проекты</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
    <?php
    $headerFile = dirname(__DIR__) . '/partials/header.html';
    if (file_exists($headerFile)) {
        require $headerFile;
    }
    ?>

    <?php if (!empty($flash)): ?>
        <div class="alert <?= htmlspecialchars($flash['type']) ?>">
            <?= htmlspecialchars($flash['message']) ?>
        </div>
    <?php endif; ?>

    <?php
    $search = $search ?? '';
    $totalItems = $totalItems ?? count($projects);
    $page = $page ?? 1;
    $totalPages = $totalPages ?? 1;
    ?>

    <section class="table-section">
        <div class="section-header">
            <h2>Список проектов (<?= (int)$totalItems ?>)</h2>
            <a href="project_create.php" class="btn-primary">+ Создать проект</a>
        </div>

        <form method="get" action="projects.php" style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
            <input type="text" name="q" value="<?= htmlspecialchars($search) ?>" placeholder="Поиск по коду или названию..." style="padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 260px;">
            <button type="submit" class="btn-primary" style="border: none; cursor: pointer;">Найти</button>
            <?php if ($search !== ''): ?>
                <a href="projects.php" class="btn-sm" style="display: inline-flex; align-items: center;">Сбросить</a>
            <?php endif; ?>
        </form>

        <?php if (count($projects) > 0): ?>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Код</th>
                            <th>Название</th>
                            <th>Владелец</th>
                            <th>Дефектов</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <?php foreach ($projects as $proj): ?>
                            <tr>
                                <td><?= (int)$proj['project_id'] ?></td>
                                <td><strong><?= htmlspecialchars($proj['code']) ?></strong></td>
                                <td>
                                    <a href="project_view.php?id=<?= (int)$proj['project_id'] ?>" class="table-link">
                                        <?= htmlspecialchars($proj['name']) ?>
                                    </a>
                                </td>
                                <td><?= htmlspecialchars($proj['owner_name'] ?? 'Не указан') ?></td>
                                <td><?= (int)$proj['bugs_count'] ?></td>
                                <td class="actions-cell">
                                    <a href="project_view.php?id=<?= (int)$proj['project_id'] ?>" class="btn-sm">Открыть</a>
                                    <?php if (canManageProject($pdo, $proj)): ?>
                                        <a href="project_edit.php?id=<?= (int)$proj['project_id'] ?>" class="btn-sm">Изменить</a>
                                        <form method="post" action="project_delete.php" class="inline-form" onsubmit="return confirm('Удалить проект?');">
                                            <input type="hidden" name="csrf_token" value="<?= htmlspecialchars(csrfToken()) ?>">
                                            <input type="hidden" name="project_id" value="<?= (int)$proj['project_id'] ?>">
                                            <button type="submit" class="btn-sm btn-danger">Удалить</button>
                                        </form>
                                    <?php else: ?>
                                        <span class="muted-hint">Удаление недоступно</span>
                                    <?php endif; ?>
                                </td>
                            </tr>
                        <?php endforeach; ?>
                    </tbody>
                </table>
            </div>

            <?php if ($totalPages > 1): ?>
                <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <span class="muted-hint">Показано <?= count($projects) ?> из <?= (int)$totalItems ?> (Страница <?= (int)$page ?> из <?= (int)$totalPages ?>)</span>
                    <div style="display: flex; gap: 6px;">
                        <?php for ($i = 1; $i <= $totalPages; $i++): ?>
                            <?php
                            $query = http_build_query(['q' => $search, 'page' => $i]);
                            $activeClass = ($i === $page) ? 'nav-btn active' : 'btn-sm';
                            ?>
                            <a href="projects.php?<?= htmlspecialchars($query) ?>" class="<?= $activeClass ?>">
                                <?= $i ?>
                            </a>
                        <?php endfor; ?>
                    </div>
                </div>
            <?php endif; ?>
        <?php else: ?>
            <p class="empty-msg">Проекты пока не созданы.</p>
        <?php endif; ?>
    </section>
</div>
</body>
</html>
